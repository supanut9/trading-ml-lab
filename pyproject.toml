[project]
name = "trading-ml-lab"
version = "0.1.0"
description = "ML experimentation for trading"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "trading-strategies @ file:///Users/supanut.tan/projects/supanut9/trading-strategies",
    "trading-data-pipeline @ file:///Users/supanut.tan/projects/supanut9/trading-data-pipeline",
    "torch>=2.2.0",
    "xgboost>=2.0.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.5.0",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "joblib>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mllab"]

[tool.ruff]
line-length = 88
target-version = "py313"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
